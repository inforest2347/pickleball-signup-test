<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>理論上匹克球｜課程報名</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F6F1;
    --surface: #FFFFFF;
    --ink: #1E2B2F;
    --muted: #5C6B6E;
    --line: #D3DCD6;
    --court: #2E6A9E;
    --kitchen: #4F9A6E;
    --ball: #E4E042;
    --error: #B3402E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121C20;
      --surface: #1A262B;
      --ink: #E4EBE8;
      --muted: #9AA9A6;
      --line: #2F3E42;
      --court: #4C8BC4;
      --kitchen: #5FAF80;
      --error: #E07A66;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .court { display: block; width: 100%; height: auto; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 20px 32px; }
  h1 { font-size: 26px; line-height: 1.3; margin: 4px 0 4px; font-weight: 700; letter-spacing: 0.02em; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  .field { margin-bottom: 18px; }
  label, legend { display: block; font-weight: 500; margin-bottom: 6px; }
  fieldset { border: 0; padding: 0; margin: 0 0 18px; }
  input[type="text"], input[type="tel"], select, textarea {
    width: 100%; font: inherit; color: inherit;
    background: var(--surface);
    border: 1.5px solid var(--line); border-radius: 10px;
    padding: 11px 12px;
  }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible, .chip input:focus-visible + span {
    outline: 3px solid var(--ball); outline-offset: 1px; border-color: var(--court);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span {
    display: inline-block; padding: 8px 14px; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--surface); cursor: pointer;
  }
  .chip input:checked + span { background: var(--kitchen); border-color: var(--kitchen); color: #fff; }
  .hint { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .error { color: var(--error); font-weight: 500; min-height: 1.6em; margin: 0 0 12px; }
  button.primary {
    width: 100%; font: inherit; font-weight: 700; font-size: 17px;
    padding: 14px; border: 0; border-radius: 12px;
    background: var(--court); color: #fff; cursor: pointer;
  }
  button.primary:disabled { opacity: 0.6; cursor: wait; }
  .status { text-align: center; padding: 48px 0; color: var(--muted); }
  .done { text-align: center; padding: 24px 0; }
  .done .ball {
    width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%;
    background: var(--ball); display: grid; place-items: center;
    font-size: 30px; color: #1E2B2F; font-weight: 700;
  }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    .done .ball { animation: bounce 0.6s ease-out; }
    @keyframes bounce { 0% { transform: translateY(-24px); } 60% { transform: translateY(4px); } 100% { transform: none; } }
  }
</style>
</head>
<body>
  <!-- 俯視球場：藍色場地、綠色廚房區、一顆黃球 -->
  <svg class="court" viewBox="0 0 400 96" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
    <rect width="400" height="96" fill="var(--court)"/>
    <rect x="160" y="0" width="80" height="96" fill="var(--kitchen)"/>
    <g stroke="#fff" stroke-width="2.5" fill="none">
      <rect x="20" y="12" width="360" height="72"/>
      <line x1="200" y1="12" x2="200" y2="84" stroke-dasharray="4 4"/>
      <line x1="160" y1="12" x2="160" y2="84"/>
      <line x1="240" y1="12" x2="240" y2="84"/>
      <line x1="20" y1="48" x2="160" y2="48"/>
      <line x1="240" y1="48" x2="380" y2="48"/>
    </g>
    <circle cx="292" cy="32" r="7" fill="var(--ball)"/>
  </svg>

  <main>
    <p id="status" class="status">正在連接 LINE…</p>

    <form id="signup" hidden novalidate>
      <h1>課程報名</h1>
      <p class="lead">填好送出後，LINE 會收到報名確認訊息。</p>

      <div class="field">
        <label for="name">姓名</label>
        <input id="name" name="name" type="text" maxlength="30" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="phone">手機</label>
        <input id="phone" name="phone" type="tel" inputmode="numeric" maxlength="12" placeholder="0912345678" autocomplete="tel" required>
      </div>

      <div class="field">
        <label for="session">場次</label>
        <!-- 測試用的固定選項，之後可改成從 Sheet 讀取 -->
        <select id="session" name="session" required>
          <option value="">請選擇場次</option>
          <option>10/12（日）09:00 新手體驗班</option>
          <option>10/15（三）19:30 基礎技術班</option>
          <option>10/19（日）14:00 對打練習班</option>
        </select>
      </div>

      <fieldset>
        <legend>目前程度</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="level" value="第一次接觸"><span>第一次接觸</span></label>
          <label class="chip"><input type="radio" name="level" value="會基本擊球"><span>會基本擊球</span></label>
          <label class="chip"><input type="radio" name="level" value="有比賽經驗"><span>有比賽經驗</span></label>
        </div>
      </fieldset>

      <div class="field">
        <label for="note">備註</label>
        <textarea id="note" name="note" maxlength="300" placeholder="例如：需要借球拍、想和朋友同一班"></textarea>
        <p class="hint">選填</p>
      </div>

      <p id="error" class="error" role="alert"></p>
      <button id="submit" class="primary" type="submit">送出報名</button>
    </form>

    <section id="done" class="done" hidden>
      <div class="ball" aria-hidden="true">✓</div>
      <h1>報名完成</h1>
      <p class="lead">確認訊息已傳到你的 LINE 聊天室。</p>
      <button id="close" class="primary" type="button">回到聊天室</button>
    </section>
  </main>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  // 這兩個值本來就是公開的，可以放在前端；Token 和 Secret 只放在 GAS
  const LIFF_ID = '2011866173-yCw7kiVc';
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbyV9gOs3mWLUqoanuGtQRTQdS9QNCAdu2woERD-ufmhqeXCO4aRb7cvzq9LSwgLJtJ7aA/exec';

  const $ = (id) => document.getElementById(id);
  const form = $('signup');

  function showError(message) { $('error').textContent = message; }

  function readForm() {
    const data = new FormData(form);
    return {
      name: (data.get('name') || '').trim(),
      phone: (data.get('phone') || '').replace(/[\s-]/g, ''),
      session: data.get('session') || '',
      level: data.get('level') || '',
      note: (data.get('note') || '').trim()
    };
  }

  function validate(f) {
    if (!f.name) return '請填寫姓名';
    if (!/^09\d{8}$/.test(f.phone)) return '手機號碼格式應為 09 開頭共 10 碼';
    if (!f.session) return '請選擇場次';
    if (!f.level) return '請選擇目前程度';
    return '';
  }

  async function start() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: location.href });
        return;
      }
      const profile = await liff.getProfile();
      $('name').value = profile.displayName || '';
      $('status').hidden = true;
      form.hidden = false;
    } catch (err) {
      // 測試期間顯示實際錯誤，上線前可改回簡單的提示文字
      $('status').textContent = '無法連接 LINE（' + (err.code || '無錯誤代碼') + '）：' + (err.message || err);
      console.error(err);
    }
  }

  // 每次開啟表單產生一個送出編號；重送時沿用，GAS 以此避免重複報名
  let submissionId = null;

  function newSubmissionId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
  }

  /** 送出一次；回傳 GAS 的 JSON，若逾時或回應不是 JSON 則回傳 null（結果未知） */
  async function postSignup(payload) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 20000);
    try {
      // text/plain 可避免瀏覽器先發 OPTIONS 預檢，GAS 不支援預檢
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
        signal: controller.signal
      });
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch (parseError) {
        console.warn('GAS 回應不是 JSON：', text.slice(0, 200));
        return null;
      }
    } catch (networkError) {
      console.warn('送出失敗或逾時：', networkError);
      return null;
    } finally {
      clearTimeout(timer);
    }
  }

  function resetButton() {
    $('submit').disabled = false;
    $('submit').textContent = '送出報名';
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const data = readForm();
    const message = validate(data);
    if (message) { showError(message); return; }

    showError('');
    $('submit').disabled = true;
    $('submit').textContent = '送出中…';
    if (!submissionId) submissionId = newSubmissionId();

    const payload = () => ({ action: 'signup', submissionId, idToken: liff.getIDToken(), form: data });
    let result = await postSignup(payload());
    if (!result) {
      // 結果未知時自動重送一次；同一個送出編號不會重複寫入
      $('submit').textContent = '確認中…';
      result = await postSignup(payload());
    }

    if (result && result.ok) {
      form.hidden = true;
      $('done').hidden = false;
      return;
    }
    if (result) {
      showError(result.error || '報名沒有成功送出，請稍後再試');
    } else {
      showError('目前無法確認結果。若 LINE 已收到「報名成功」訊息即代表完成；若沒有，請再按一次送出，不會重複報名。');
    }
    resetButton();
  });

  $('close').addEventListener('click', () => {
    if (liff.isInClient()) liff.closeWindow();
    else window.close();
  });

  start();
</script>
</body>
</html>
